<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ username }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="left-shape"></div>
        <div class="left-shape2"></div>
        <div class="right-shape"></div>
        <!-- menambahkan hiasan di pojok kanan dan kiri atas -->
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ username }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <!-- <a href="{% url 'skill_page' %}">Skill</a> -->
                <!-- <a href="{% url 'project_page' %}">Project</a> -->
                <a href="{% url 'main:show_education' %}">Education</a>
                <a href="{% url 'main:show_interest' %}">Interest</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Hello</p>
                    <h1 class="intro">I'm <span class= "name">{{ username }}</span> CS student at University Indonesia </h1> 
                    <!-- menambahkan class name agar dapat mengubah hanya nama -->
                </div>
                <div class="hero-photo">
                    <img class="avatar" src="/static/img/Taufiq.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/MuhammadTaufiqRamadhan" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/muhammad-taufiq-ramadhan-7a8982379" class="social-link">LinkedIn</a>
                        <a href="mailto:taufikramadhan662@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
        <!-- <section class="mahasiswa">
            <h2>Daftar Mahasiswa (Hands On)</h2>
                {% for mhs in mahasiswa %}
                <p>
                    Nama: {{ mhs.nama }} | NPM: {{ mhs.npm }}
                </p>
                {% endfor %}
        </section> -->
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taufiq- Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="left-shape"></div>
        <div class="left-shape2"></div>
        <div class="right-shape"></div>
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ username }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <!-- <a href="{% url 'skill_page' %}">Skill</a> -->
                <!-- <a href="{% url 'project_page' %}">Project</a> -->
                <a href="{% url 'main:show_education' %}">Education</a>
                <a href="{% url 'main:show_interest' %}">Interest</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="interest-section" id="interest">
            <div class="container">
                <p class="section-kicker-interest">Hal-hal yang saya sukai</p>
                <h1>Interest</h1>
                <div class="interest-grid">
                    {% for interest in interest_list %}
                        <article class="interest-card">
                            <h2>{{ interest.nama }}</h2>
                        </article>
                    {% empty %}
                        <p class="empty-state">
                            Belum menemukan ketertarik.
                        </p>
                    {% endfor %}
                </div>
            <!-- </div> -->
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Muhammad Taufiq Ramadhan. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>

{% extends 'base.html' %}
{% block meta %}
    <title>Interest - {{ name }}</title>
{% endblock meta %}
{% block content %}

    <main>
        <section class="interest-section" id="interest">
            <div class="container">
                <p class="section-kicker-interest">Hal-hal yang saya sukai</p>
                <h1>Interest</h1>
                <div class="interest-grid">
                    {% for interest in interest_list %}
                        <article class="interest-card">
                            <h2>{{ interest.nama }}</h2>
                        </article>
                    {% empty %}
                        <p class="empty-state">
                            Belum menemukan ketertarik.
                        </p>
                    {% endfor %}
                </div>
            <!-- </div> -->
        </section>
    </main>

{% endblock content %}

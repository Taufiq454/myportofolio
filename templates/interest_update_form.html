{% extends "base.html" %}
{% block meta %}
    <title>Update Interest - {{ name }}</title>
{% endblock meta %}
{% block content %}
<main>
    <section class="interest-section">
        <div class="container">
            <h1>Tambah Minat Baru</h1>
            <form method="post"
                  action="{% url 'main:update_interest' interest.id %}"
                  class="interest-form">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                    <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
                {% endfor %}
                <button type="submit" class="button">Simpan Perubahan</button>
                <a href="{% url 'main:show_interest' %}" class="button button-secondary">Batal</a>
            </form>
        </div>
    </section>
</main>
{% endblock content %}
